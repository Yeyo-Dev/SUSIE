# ==============================================================
# SUSIE — AI Workers + Motor de Inferencia: Docker Compose
# ==============================================================
# Levanta los 3 workers de IA, la API biométrica y el Motor de
# Inferencia. Se conecta a la red externa 'susie-network' creada
# por el docker-compose del backend.
#
# IMPORTANTE: Levantar PRIMERO el compose del backend para que
# existan Redis, RabbitMQ y la red susie-network.
#
# Uso:
#   # 1. Primero levantar backend + infra:
#   cd ../backend && docker compose up -d
#
#   # 2. Luego levantar workers + engine:
#   docker compose up -d
#
#   # Solo un worker específico:
#   docker compose up -d yolo-worker
#
#   # Ver logs del motor de inferencia:
#   docker compose logs -f inference-engine
# ==============================================================

services:
  # ── Workers de IA ──────────────────────────────────────────

  # YOLOv8 Nano (~6MB modelo) + ultralytics + torch + OpenCV
  # RAM real: ~2-3 GB en inferencia
  yolo-worker:
    build:
      context: .
      dockerfile: vision_yolo/Dockerfile
    container_name: susie-yolo
    restart: on-failure
    environment:
      RABBITMQ_HOST: susie-rabbitmq
      YOLO_CONF_THRESHOLD: ${YOLO_CONF_THRESHOLD:-0.45}
      REDIS_HOST: susie-redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_EVIDENCE_TTL: ${REDIS_EVIDENCE_TTL:-86400}
      INFRACTION_QUEUE_THRESHOLD: ${INFRACTION_QUEUE_THRESHOLD:-0.5}
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 1G
    networks:
      - susie-network

  # faster-whisper (CTranslate2 int8) + SentenceTransformer (MiniLM-L12)
  # RAM real: ~3-4 GB en inferencia
  whisper-worker:
    build:
      context: .
      dockerfile: audio_whisper/Dockerfile
    container_name: susie-whisper
    restart: on-failure
    environment:
      RABBITMQ_HOST: susie-rabbitmq
      AUDIO_SILENCE_THRESHOLD_DB: ${AUDIO_SILENCE_THRESHOLD_DB:--45}
      AUDIO_SOFTMAX_TEMPERATURE: ${AUDIO_SOFTMAX_TEMPERATURE:-1.5}
      AUDIO_SEMANTIC_THRESHOLD: ${AUDIO_SEMANTIC_THRESHOLD:-0.55}
      REDIS_HOST: susie-redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_EVIDENCE_TTL: ${REDIS_EVIDENCE_TTL:-86400}
      INFRACTION_QUEUE_THRESHOLD: ${INFRACTION_QUEUE_THRESHOLD:-0.5}
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    networks:
      - susie-network

  # scikit-learn (DBSCAN + IsolationForest) + numpy — MUY liviano
  # RAM real: ~300-500 MB
  gaze-worker:
    build:
      context: .
      dockerfile: gaze_mediapipe/Dockerfile
    container_name: susie-gaze
    restart: on-failure
    environment:
      RABBITMQ_HOST: susie-rabbitmq
      GAZE_MIN_BUFFER_SIZE: ${GAZE_MIN_BUFFER_SIZE:-15}
      REDIS_HOST: susie-redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_EVIDENCE_TTL: ${REDIS_EVIDENCE_TTL:-86400}
      INFRACTION_QUEUE_THRESHOLD: ${INFRACTION_QUEUE_THRESHOLD:-0.5}
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 256M
    networks:
      - susie-network

  # ── API Biométrica (REST) ──────────────────────────────────
  # face_recognition (dlib HOG) + OpenCV — embedding 128 dims
  # Solo se usa al inicio del examen como llave de acceso
  deepface-api:
    build:
      context: ./biometric_deepface
      dockerfile: Dockerfile
    container_name: susie-deepface
    restart: on-failure
    ports:
      - "8001:8000"
    environment:
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 512M
    networks:
      - susie-network

  # ── Motor de Inferencia ────────────────────────────────────
  # Red Bayesiana (4 nodos, 256 combinaciones CPT)
  # Consume: q_evidencia → Procesa: Redis LRANGE → Exporta: Azure + PostgreSQL
  # RAM real: ~200-500 MB (muy liviano)
  inference-engine:
    build:
      context: ../inference_engine
      dockerfile: Dockerfile
    container_name: susie-inference
    restart: on-failure
    environment:
      RABBITMQ_HOST: susie-rabbitmq
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
      REDIS_HOST: susie-redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@susie-postgres:5432/${POSTGRES_DB:-susie}"
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
      AZURE_CONTAINER_NAME: ${AZURE_CONTAINER_NAME:-susie-dictamenes}
      FUSION_WINDOW_SECONDS: ${FUSION_WINDOW_SECONDS:-30}
      MUERTE_SUBITA_THRESHOLD: ${MUERTE_SUBITA_THRESHOLD:-0.95}
      SOSPECHOSO_THRESHOLD: ${SOSPECHOSO_THRESHOLD:-0.40}
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    networks:
      - susie-network

# ── Red externa (creada por el compose del backend) ───────────
networks:
  susie-network:
    external: true
    name: susie-network
